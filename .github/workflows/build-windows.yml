name: Build NotchGlass Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (C++20 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release Binary
        run: cmake --build build --config Release

      - name: Upload NotchGlass.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchGlass-Windows-x64
          path: build/Release/NotchGlass.exe
