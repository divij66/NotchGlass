name: Build & Release NotchGlass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (C++20 x64)
        run: cmake -S . -B build -A x64

      - name: Build Release Binary
        run: cmake --build build --config Release

      - name: Upload NotchGlass.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchGlass-Windows-x64
          path: build/Release/NotchGlass.exe

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NotchGlass (Windows x64)
          files: build/Release/NotchGlass.exe
          make_latest: true
